[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awesome-league-of-legends"
version = "0.1.1"
description = "Curated League of Legends champion and strategy data (combos, builds, guides, playbook)."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Sorena AI" }]

[tool.hatch.build.targets.wheel]
packages = ["awesome_league_of_legends"]

[tool.hatch.build.targets.wheel.force-include]
"champion-combos" = "awesome_league_of_legends/champion-combos"
"champion-builds" = "awesome_league_of_legends/champion-builds"
"champion-guide" = "awesome_league_of_legends/champion-guide"
"playbook" = "awesome_league_of_legends/playbook"
